[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
indent-width = 4
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
fixable = ["ALL"]
# Global ignores plus rules that conflict with this project's reality:
# - CPY001: no copyright headers used here
# - TRY003/EM101/EM102: inline exception messages are fine
ignore = [
  "B008",
  "I",
  "D202",
  "TCH001",
  "TCH003",
  "TD003",
  "S101",
  "G004",
  "CPY001",
  "TRY003",
  "EM101",
  "EM102",
]
select = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests run on stdlib unittest (no pytest): pytest-style rules, docstring
# rules, private-member access, tmp paths and boolean helpers don't apply.
"tests/**" = [
  "D",
  "FBT001",
  "INP001",
  "PLR2004",
  "PT009",
  "PT027",
  "S108",
  "SLF001",
]
